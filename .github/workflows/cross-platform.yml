name: cross-platform

on:
  schedule:
    - cron: '48 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Run cross-platform core lane
        shell: bash
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [[ -n "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]]; then
            git config --global url."https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/".insteadOf https://github.com/
            git submodule update --init --depth=1 factory
            export WRKR_PIN_CHECK_REQUIRE_FACTORY_PROFILE=1
          fi
          make lint-fast
          make test-fast
          make build
